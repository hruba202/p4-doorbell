ring:
  name: Zazvonit u dveří
  description: Zahájí hovor z volajícího ESPHome zařízení do připravené skupiny přijímačů.
leave_message:
  name: Výzva a hlasový vzkaz
  description: Přehraje nakonfigurovanou výzvu a po jejím skončení spustí desetisekundový
    záznam P4.
cancel_message:
  name: Zrušit sekvenci vzkazu
  description: Zruší čekání nebo probíhající sekvenci. Již odesílaný vzkaz nelze vzít
    zpět.
visitor_press:
  name: Stisk tlačítka návštěvníka
  description: Podle fáze zazvoní, potvrdí zahájení záznamu nebo uloží právě nahrávaný
    vzkaz. Při hovoru nic nemění.
